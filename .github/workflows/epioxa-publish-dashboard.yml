```yaml
name: Publish Saved Epioxa Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/epioxa-publish-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epioxa-daily-tracker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current saved data
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test tracker
        run: python -m unittest discover -s tests -v

      - name: Build saved dashboard
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
```
